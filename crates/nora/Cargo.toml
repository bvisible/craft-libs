# //// Neoffice — added file (no upstream equivalent): the Nora client core shared by the Neoffice editors.
[package]
name = "craft-nora"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Sans-I/O client core for Nora, the Neoffice assistant: protocol, conversation state machine and document actions"

[lints]
workspace = true

[features]
# Nora's errors and turns in the shared vocabulary of craft-ai-core (`NoraError::kind`, `NoraSession::turn_state`).
ai-core = ["dep:craft-ai-core"]

[dependencies]
craft-ai-core = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
