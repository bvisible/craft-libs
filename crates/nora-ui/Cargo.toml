# //// Neoffice — added file (no upstream equivalent): the egui panel of the Nora client core.
[package]
name = "craft-nora-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "egui panel to talk to Nora inside a Craft editor, on top of craft-nora"

[lints]
workspace = true

[dependencies]
craft-nora = { workspace = true }
# The editors and NeoMail (UCS's MailCraft) are on egui 0.37, like this workspace; the range still admits 0.36 for an app
# that has not moved yet, and the panel is written to the API both share. Cargo keeps one egui per app: the one its lock has.
egui = { version = ">=0.36, <0.38", default-features = false }

# //// Neoffice — the pane's state, remembered in the browser (launcher.rs, PaneMemory).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
# //// Neoffice — egui_kittest follows the workspace egui (0.37 since the merge of upstream 2026-11-02); the 0.36 one pulls a second egui into the tests.
egui_kittest = "0.37"
serde_json = "1"
