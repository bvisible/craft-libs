# //// Neoffice — added file (no upstream equivalent): the egui panel of the Nora client core.
[package]
name = "craft-nora-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "egui panel to talk to Nora inside a Craft editor, on top of craft-nora"

[lints]
workspace = true

# //// Neoffice — `cargo test -p craft-nora-ui --features preview -- --ignored` draws the pane to PNG files (NORA_PREVIEW_DIR):
# the only way to look at what egui draws without a window. Off by default: it builds wgpu.
[features]
preview = ["egui_kittest/wgpu", "dep:image"]

[dependencies]
craft-nora = { workspace = true }
# The editors and NeoMail (UCS's MailCraft) are on egui 0.37, like this workspace. The panel names widgets by their accesskit
# `Role` (0.37), so 0.36 is no longer admitted. Cargo keeps one egui per app: the one its lock has.
egui = { version = ">=0.37, <0.38", default-features = false }

# //// Neoffice — the pane's state remembered in the browser (launcher.rs, PaneMemory), and the microphone of its dictation
# (voice.rs: getUserMedia, MediaRecorder, the voice's level).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Storage", "Navigator", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "MediaRecorder",
    "MediaRecorderOptions", "RecordingState", "BlobEvent", "Blob", "BlobPropertyBag", "AudioContext", "AudioNode", "AnalyserNode",
    "MediaStreamAudioSourceNode", "Performance",
] }

[dependencies.image]
version = "0.25"
optional = true
default-features = false
features = ["png"]

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
# //// Neoffice — egui_kittest follows the workspace egui (0.37 since the merge of upstream 2026-11-02); the 0.36 one pulls a second egui into the tests.
egui_kittest = "0.37"
serde_json = "1"
